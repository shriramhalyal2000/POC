apiVersion: apps/v1
kind: Deployment
metadata:
  name: notebook-frontend-Deployment
  labels:
    app: notebook
    tier: frontend
  namespace: kube-notebook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notebook
      tier: frontend
  template:
    metadata:
      labels:
        app: notebook
        tier: frontend
    spec:
      containers:
        - name: notebook:frontend
          image: notebook:frontend-1.0.0
          ports:
          - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-Service
  labels:
    app: notebook
    tier: frontend
  namespace: kube-notebook
spec:
  selector:
    app: notebook
  type: NodePort
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 31002